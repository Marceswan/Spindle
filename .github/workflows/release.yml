name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-matrix:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            output: sfdx-graph-mcp-darwin-arm64
          - target: bun-darwin-x64
            output: sfdx-graph-mcp-darwin-x64
          - target: bun-linux-x64
            output: sfdx-graph-mcp-linux-x64
          - target: bun-linux-arm64
            output: sfdx-graph-mcp-linux-arm64
          - target: bun-windows-x64
            output: sfdx-graph-mcp-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate source (linux-x64 only)
        if: matrix.target == 'bun-linux-x64'
        run: |
          bun run typecheck
          bun test --timeout 30000

      - name: Require release trust key
        run: |
          test "$GITHUB_REF_NAME" = "v$(bun -p 'require("./package.json").version')" || { echo "Release tag must match package.json"; exit 1; }
          test -s .github/release-public-key.asc || { echo "Configure the public release key per docs/release-signing.md"; exit 1; }
          gpg --batch --show-keys .github/release-public-key.asc > /dev/null

      - name: Build target
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --target="$TARGET" --outfile "dist/$OUTPUT" --define "SPINDLE_RELEASE_PUBLIC_KEY=$(jq -Rs . < .github/release-public-key.asc)"

      - name: Smoke test (linux-x64 only)
        if: matrix.target == 'bun-linux-x64'
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          "./dist/$OUTPUT" --version
          "./dist/$OUTPUT" --help

      - name: Compute SHA256
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          cd dist
          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts + aggregate SHA256SUMS
        run: |
          mkdir -p release
          printf '# Spindle release %s\n' "$GITHUB_REF_NAME" > release/SHA256SUMS
          find artifacts -type f -name "sfdx-graph-mcp-*" -not -name "*.sha256" -exec mv {} release/ \;
          find artifacts -type f -name "*.sha256" -exec cat {} >> release/SHA256SUMS \;
          ls -la release/

      - name: Sign and verify release manifest
        env:
          RELEASE_GPG_PRIVATE_KEY: ${{ secrets.RELEASE_GPG_PRIVATE_KEY }}
          RELEASE_GPG_PASSPHRASE: ${{ secrets.RELEASE_GPG_PASSPHRASE }}
        run: |
          test -n "$RELEASE_GPG_PRIVATE_KEY" || { echo "RELEASE_GPG_PRIVATE_KEY is required"; exit 1; }
          export GNUPGHOME="$RUNNER_TEMP/spindle-release-gpg"
          mkdir -m 700 "$GNUPGHOME"
          trap 'gpgconf --kill all; rm -rf "$GNUPGHOME"' EXIT
          fingerprint=$(gpg --batch --with-colons --show-keys .github/release-public-key.asc | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          printf '%s' "$RELEASE_GPG_PRIVATE_KEY" | gpg --batch --import
          printf '%s' "$RELEASE_GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$fingerprint" --armor --detach-sign --output release/SHA256SUMS.asc release/SHA256SUMS
          gpg --batch --verify release/SHA256SUMS.asc release/SHA256SUMS
          cp .github/release-public-key.asc release/RELEASE-PUBLIC-KEY.asc

      - name: Stage install scripts alongside binaries
        run: |
          cp install.sh release/
          cp install.ps1 release/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
