name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-matrix:
    name: build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-darwin-arm64
            output: sfdx-graph-mcp-darwin-arm64
          - target: bun-darwin-x64
            output: sfdx-graph-mcp-darwin-x64
          - target: bun-linux-x64
            output: sfdx-graph-mcp-linux-x64
          - target: bun-linux-arm64
            output: sfdx-graph-mcp-linux-arm64
          - target: bun-windows-x64
            output: sfdx-graph-mcp-windows-x64.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build target
        env:
          TARGET: ${{ matrix.target }}
          OUTPUT: ${{ matrix.output }}
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --target="$TARGET" --outfile "dist/$OUTPUT"

      - name: Smoke test (linux-x64 only)
        if: matrix.target == 'bun-linux-x64'
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          "./dist/$OUTPUT" --version
          "./dist/$OUTPUT" --help

      - name: Compute SHA256
        env:
          OUTPUT: ${{ matrix.output }}
        run: |
          cd dist
          shasum -a 256 "$OUTPUT" > "$OUTPUT.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: |
            dist/${{ matrix.output }}
            dist/${{ matrix.output }}.sha256
          retention-days: 7
          if-no-files-found: error

  release:
    name: Publish release
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts + aggregate SHA256SUMS
        run: |
          mkdir -p release
          find artifacts -type f -name "sfdx-graph-mcp-*" -not -name "*.sha256" -exec mv {} release/ \;
          find artifacts -type f -name "*.sha256" -exec cat {} >> release/SHA256SUMS \;
          ls -la release/

      - name: Stage install scripts alongside binaries
        run: |
          cp install.sh release/
          cp install.ps1 release/
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
