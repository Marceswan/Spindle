name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-test:
    name: typecheck + test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Run tests
        run: bun test
        env:
          SFDX_GRAPH_LOG_LEVEL: silent

      - name: Compile single-binary smoke test
        # Regression guard for asset-bundling bugs (schema.sql et al). The compiled binary
        # must boot, print --version, and run --help without ENOENT or runtime errors.
        run: |
          mkdir -p dist
          bun build src/cli.ts --compile --outfile dist/sfdx-graph-mcp
          ./dist/sfdx-graph-mcp --version
          ./dist/sfdx-graph-mcp --help > /dev/null
